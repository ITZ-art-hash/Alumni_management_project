<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Event Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/alumni}">Alumni Platform</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/alumni}">Alumni</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/alumni/new}">Add Alumni</a></li>
                <li class="nav-item" sec:authorize="hasRole('ALUMNI')"><a class="nav-link" th:href="@{/alumni/profile}">My Profile</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/alumni/mentors}">Mentors</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/events}">Events</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/jobs}">Jobs</a></li>
                <li class="nav-item" sec:authorize="hasRole('ALUMNI')"><a class="nav-link" th:href="@{/recommendations}">Recommended Jobs</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/admin/pending-users}">Pending Approvals</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/admin/dashboard}">Dashboard</a></li>
            </ul>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="card shadow-sm">
        <div class="card-body">
            <h3 th:text="${event.title}"></h3>
            <dl class="row mt-3">
                <dt class="col-sm-3">Date</dt>
                <dd class="col-sm-9" th:text="${event.eventDate}"></dd>

                <dt class="col-sm-3">Location</dt>
                <dd class="col-sm-9" th:text="${event.location}"></dd>

                <dt class="col-sm-3">Description</dt>
                <dd class="col-sm-9" th:text="${event.description}"></dd>

                <dt class="col-sm-3">Attending</dt>
                <dd class="col-sm-9" th:text="${#sets.size(event.attendees)} + ' alumni'"></dd>
            </dl>

            <ul class="mb-3" th:if="${not #sets.isEmpty(event.attendees)}">
                <li th:each="email : ${event.attendees}" th:text="${email}"></li>
            </ul>

            <form th:if="${not attending}" th:action="@{/events/{id}/rsvp(id=${event.id})}" method="post" class="d-inline">
                <button type="submit" class="btn btn-primary">RSVP</button>
            </form>
            <form th:if="${attending}" th:action="@{/events/{id}/cancel-rsvp(id=${event.id})}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-secondary">Cancel RSVP</button>
            </form>

            <form sec:authorize="hasRole('ADMIN')" th:action="@{/events/{id}/delete(id=${event.id})}" method="post" class="d-inline" onsubmit="return confirm('Delete this event?');">
                <button type="submit" class="btn btn-danger">Delete</button>
            </form>

            <a th:href="@{/events}" class="btn btn-outline-secondary">Back</a>
        </div>
    </div>
</div>
<footer class="site-footer text-center py-3 mt-5">
    <div class="container">
        <small>&copy; 2026 Alumni Platform. All rights reserved.</small>
    </div>
</footer>
</body>
</html>
