<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Alumni Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/alumni}">Alumni Platform</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/alumni}">Alumni</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/alumni/new}">Add Alumni</a></li>
                <li class="nav-item" sec:authorize="hasRole('ALUMNI')"><a class="nav-link" th:href="@{/alumni/profile}">My Profile</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/alumni/mentors}">Mentors</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/events}">Events</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/jobs}">Jobs</a></li>
                <li class="nav-item" sec:authorize="hasRole('ALUMNI')"><a class="nav-link" th:href="@{/recommendations}">Recommended Jobs</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/admin/pending-users}">Pending Approvals</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/admin/dashboard}">Dashboard</a></li>
            </ul>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="mb-4" th:text="${alumni.id != null} ? 'Edit Alumni' : 'Add Alumni'"></h2>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <form th:action="@{/alumni}" th:object="${alumni}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" required>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" th:field="*{email}" class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" required>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Batch Year</label>
            <input type="number" th:field="*{batch}" class="form-control" th:classappend="${#fields.hasErrors('batch')} ? 'is-invalid'" required>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('batch')}" th:errors="*{batch}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Department</label>
            <select th:field="*{department}" class="form-select" th:classappend="${#fields.hasErrors('department')} ? 'is-invalid'" required>
                <option value="CSE">CSE</option>
                <option value="ECE">ECE</option>
                <option value="ME">ME</option>
                <option value="CE">CE</option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Company</label>
            <input type="text" th:field="*{company}" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Skills (comma-separated)</label>
            <input type="text" th:field="*{skills}" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">LinkedIn</label>
            <input type="text" th:field="*{linkedin}" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="text" th:field="*{phone}" class="form-control">
        </div>

        <button type="submit" class="btn btn-primary">Save</button>
        <a th:href="@{/alumni}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
<footer class="site-footer text-center py-3 mt-5">
    <div class="container">
        <small>&copy; 2026 Alumni Platform. All rights reserved.</small>
    </div>
</footer>
</body>
</html>
