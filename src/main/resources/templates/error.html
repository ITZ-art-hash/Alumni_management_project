<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error - Alumni Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6">
            <div class="card shadow-sm text-center">
                <div class="card-body p-5">
                    <h1 class="display-4" th:text="${status} ?: '?'"></h1>
                    <p class="lead" th:text="${error} ?: 'Something went wrong'"></p>
                    <p class="text-muted" th:if="${status == 403}">You don't have permission to do that.</p>
                    <p class="text-muted" th:if="${status == 404}">The page you're looking for doesn't exist.</p>
                    <a th:href="@{/alumni}" class="btn btn-primary mt-3">Back to Alumni</a>
                </div>
            </div>
        </div>
    </div>
</div>
<footer class="site-footer text-center py-3 mt-5">
    <div class="container">
        <small>&copy; 2026 Alumni Platform. All rights reserved.</small>
    </div>
</footer>
</body>
</html>
