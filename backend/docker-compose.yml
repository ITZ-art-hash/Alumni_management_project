services:
  postgres:
    image: postgres:17-alpine
    container_name: technoboost-postgres
    environment:
      POSTGRES_DB: technoboost_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d technoboost_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
